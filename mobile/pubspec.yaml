name: sika_assistant_mobile
description: "SIKA - Agent Financier Autonome Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Network & API
  http: ^1.2.0

  # Voice & Audio AI
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5

  # Icons & UI
  cupertino_icons: ^1.0.6
  avatar_glow: ^3.0.1

  # Native & Hardware
  permission_handler: ^11.2.0

  # Utilitaires
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Configuration de l'écran de démarrage natif
flutter_native_splash:
  color: "#0B0F19"
  color_dark: "#0B0F19"
  image: assets/images/sika_logo.png
  android_12:
    image: assets/images/sika_logo.png
    icon_background_color: "#0B0F19"
    color: "#0B0F19"
