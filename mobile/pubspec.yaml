name: sika_assistant_mobile
description: "SIKA - Agent Financier Autonome Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Network & API
  http: ^1.2.0

  # Storage & Preferences
  shared_preferences: ^2.2.2

  # Google Authentication
  google_sign_in: ^6.2.1

  # Voice & Audio AI
  speech_to_text: ^7.4.0
  flutter_tts: ^3.8.5
  audioplayers: ^6.0.0

  # Icons & UI
  cupertino_icons: ^1.0.6
  avatar_glow: ^3.0.1

  # Native & Hardware
  permission_handler: ^11.2.0

  # Utilitaires
  intl: ^0.18.1
  lottie: ^3.5.1
  flutter_secure_storage: ^11.0.0
  image_picker: ^1.2.3
  camera: ^0.12.0+2
  google_mlkit_face_detection: ^0.15.1
  google_mlkit_text_recognition: ^0.17.1
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Configuration de l'écran de démarrage natif (Nettoyé pour être invisible)
flutter_native_splash:
  color: "#020614" # Harmonisé avec le fond exact de votre SplashScreen Dart (0xff020614)
  color_dark: "#020614"
  fullscreen: true
  # Ligne "image" supprimée volontairement ici pour éviter le logo statique initial

  android_12:
    color: "#020614"
    icon_background_color: "#020614"
    # Ligne "image" supprimée volontairement ici aussi
