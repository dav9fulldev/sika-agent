plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.sika.assistant"
    compileSdk 37
    ndkVersion "28.2.13676358"

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.sika.assistant"
        minSdk 24
        targetSdk 36
        // Version issue de pubspec.yaml (x.y.z, mise à jour par release-please).
        // versionCode dérivé de x.y.z (2.1.0 -> 20100) pour rester croissant ; --build-number reste prioritaire.
        def semver = flutter.versionName.tokenize('.').collect { it.replaceAll('[^0-9]', '') as int }
        versionCode(flutter.versionCode > 1 ? flutter.versionCode : semver[0] * 10000 + semver[1] * 100 + semver[2])
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "com.alphacephei:vosk-android:0.3.47@aar"
    implementation "net.java.dev.jna:jna:5.13.0"
}

flutter {
    source "../.."
}
