plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Clé de signature release (jamais dans le dépôt) : android/key.properties en local, secrets GitHub en CI.
// Sans elle, l'APK release est signé avec la clé de debug (installable, mais Google Sign-In ne l'acceptera pas).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader -> keystoreProperties.load(reader) }
}

android {
    namespace "com.sika.assistant"
    compileSdk 37
    ndkVersion "28.2.13676358"

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.sika.assistant"
        minSdk 24
        targetSdk 36
        // Version issue de pubspec.yaml (x.y.z, mise à jour par release-please).
        // versionCode dérivé de x.y.z (2.1.0 -> 20100) pour rester croissant ; --build-number reste prioritaire.
        def semver = flutter.versionName.tokenize('.').collect { it.replaceAll('[^0-9]', '') as int }
        versionCode(flutter.versionCode > 1 ? flutter.versionCode : semver[0] * 10000 + semver[1] * 100 + semver[2])
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            // R8 : retire le code et les ressources inutilisés (règles des plugins + proguard-rules.pro)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// APK release 64 bits uniquement (tous les téléphones Android récents) : sans ce filtre, les bibliothèques
// natives des plugins (ML Kit) restent embarquées pour 3 architectures. Les builds debug ne sont pas concernés.
androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        variant.packaging.jniLibs.excludes.addAll(["lib/armeabi-v7a/**", "lib/x86_64/**", "lib/x86/**"])
    }
}

dependencies {
    implementation "androidx.cardview:cardview:1.0.0"
}

flutter {
    source "../.."
}
