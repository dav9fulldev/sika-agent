name: Release

# À chaque merge sur main, release-please ouvre (ou met à jour) une PR « chore: release x.y.z » :
# CHANGELOG.md, version de l'API (backend/app/config.py) et de l'app (mobile/pubspec.yaml).
# Merger cette PR crée le tag vX.Y.Z et la release GitHub. Rien n'est publié sans ce merge.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Chaque nouvelle release reçoit son APK Android signé (lien stable : /releases/latest)
  android-apk:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release-apk.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
